name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

#_______________________________workflow hygiene_________________________________________

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.23.3

#________________________________________________________________________________________

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

        # _____ Gate 1: Formatting______________________________________________________
      - name: Gate 1 — Format check
        id: gate1
        run: pnpm run format:check 2>&1 | tee format-check.log

      - name: Upload gate 1 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-1-format-report
          path: format-check.log
          if-no-files-found: warn

      # ----- Gate 2: Lint --------------------------------------------------
      - name: Gate 2 — Lint
        id: gate2
        run: pnpm run lint 2>&1 | tee lint.log

      - name: Upload gate 2 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-2-lint-report
          path: lint.log
          if-no-files-found: warn

      # ----- Gate 3: Type contract ----------------------------------------
      - name: Generate Prisma Client
        run: pnpm --filter @sit/api exec prisma generate
        working-directory: apps/api
        env:
          # Prisma 7 requires DATABASE_URL for `prisma generate` even though
          # it doesn't connect to the database. A dummy value satisfies the
          # config validation; the real URL is set by Testcontainers in tests.
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Gate 3 — Type check
        id: gate3
        run: pnpm run typecheck 2>&1 | tee typecheck.log

      - name: Upload gate 3 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-3-typecheck-report
          path: typecheck.log
          if-no-files-found: warn

      # ----- Gate 4: Tests (unit tests + coverage + JUnit XML) ---
      - name: Gate 4 — Tests
        id: gate4
        run: |
          if find apps packages -type f \( -name "*.spec.ts" -o -name "*.test.ts" \) 2>/dev/null | grep -q .; then
            pnpm run test 2>&1 | tee test.log
          else
            echo "no test files exist yet; gate 4 is wired" > test.log
          fi

      - name: Upload gate 4 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-4-test-report
          path: |
            test.log
            junit.xml
            coverage/
          if-no-files-found: warn

      # ----- Gate 6: Build -------------------------------------------------
      - name: Gate 6 — Build API image
        id: gate6
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t sit-api:${{ github.sha }} \
            --iidfile image-digest.txt \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            . 2>&1 | tee build.log

      - name: Upload gate 6 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-6-build-report
          path: |
            build.log
            image-digest.txt
          if-no-files-found: warn

      # ----- Gate 8: Deployment checks ------------------------------------
      - name: Gate 8 — Compose manifest validation
        id: gate8
        run: |
          docker compose -f infrastructure/docker-compose.yml config -q
          docker compose -f infrastructure/docker-compose.yml config --no-interpolate > compose-rendered.yaml
          echo "compose manifest is syntactically valid" | tee gate-8.log

      - name: Gate 8 — Environment contract
        run: |
          if [ ! -f .env.compose.example ]; then
            echo "::error::.env.compose.example is missing"
            exit 1
          fi
          missing=0
          for var in $(grep -oE '^[A-Z_]+' .env.compose.example); do
            if ! grep -qF "\${$var" compose-rendered.yaml; then
              echo "::error::environment variable $var declared in .env.compose.example but not consumed by compose"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "environment contract satisfied ($(grep -cE '^[A-Z_]+' .env.compose.example) variables)" | tee -a gate-8.log

      - name: Gate 8 — Image integrity
        run: |
          DIGEST=$(cat image-digest.txt)
          if [ -z "$DIGEST" ]; then
            echo "::error::image digest is empty; the build artifact is not traceable"
            exit 1
          fi
          echo "image digest: $DIGEST" | tee -a gate-8.log

      - name: Upload gate 8 report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-8-deployment-report
          path: |
            gate-8.log
            compose-rendered.yaml
          if-no-files-found: warn

      - name: Summary — Quality gates
        if: always()
        run: |
          {
            echo "## CI Pipeline — Quality & Build"
            echo ""
            echo "Overall: ${{ (steps.gate1.outcome == 'success' && steps.gate2.outcome == 'success' && steps.gate3.outcome == 'success' && steps.gate4.outcome == 'success' && steps.gate6.outcome == 'success' && steps.gate8.outcome == 'success') && 'all gates passed' || 'one or more gates failed' }}"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| 1 — Format | ${{ steps.gate1.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 2 — Lint | ${{ steps.gate2.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 3 — Typecheck | ${{ steps.gate3.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 4 — Tests | ${{ steps.gate4.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 6 — Build | ${{ steps.gate6.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 8 — Compose | ${{ steps.gate8.outcome == 'success' && 'passed' || 'failed' }} |"
            echo ""
            echo "### Test results (Gate 4)"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            grep -E "Test Files|Tests " test.log 2>/dev/null | tail -4 | sed 's/^/| /; s/$/ |/' || echo "| (no test log) | |"
            echo ""
            echo "### Coverage (Gate 4, v8)"
            echo ""
            echo "| Metric | Statements | Branches | Functions | Lines |"
            echo "|--------|------------|----------|-----------|-------|"
            # Coverage final table "All files" row (strip ANSI, pad columns).
            grep -E "All files" test.log 2>/dev/null | tail -1 | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g; s/\|/|/g' | awk -F'|' '{printf "| Overall | %s | %s | %s | %s |\n", $2, $3, $4, $5}' || echo "| (no coverage row in log) | | | | |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── NEW: collapsible per-gate content, same pattern as the Trivy block ──
      - name: Publish quality gate logs to summary
        if: always()
        run: |
          publish() {
            title="$1"; file="$2"; max="${3:-200}"
            [ -s "$file" ] || return 0
            total=$(wc -l < "$file")
            strip_ansi() { sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g'; }
            {
              echo ""
              echo "<details><summary>${title} — ${total} lines</summary>"
              echo ""
              echo '```'
              if [ "$total" -le "$max" ]; then
                strip_ansi < "$file"
              else
                head -n $((max / 2)) "$file" | strip_ansi
                echo "... $((total - max)) lines omitted ..."
                tail -n $((max / 2)) "$file" | strip_ansi
              fi
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          publish "Gate 1 — Format" format-check.log
          publish "Gate 2 — Lint" lint.log
          publish "Gate 3 — Typecheck" typecheck.log
          publish "Gate 4 — Vitest Tests" test.log
          publish "Gate 6 — Build" build.log 300
          publish "Gate 8 — Compose" gate-8.log

  # ----- Gate 7: Browser E2E (Playwright + axe against the Compose stack) --
  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      # E2E drives many requests from one IP; the production throttler
      # (10/min/route) would 429 the later tests. Raising it for this
      # job only; the shipped Compose default stays 10.
      THROTTLE_LIMIT: '1000'
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres and API (Compose)
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build postgres api
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "api healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/health

      - name: Install Playwright browsers
        run: |
          key=$(node -e "console.log(require('./apps/web/package.json').devDependencies['@playwright/test'])")
          cache_dir="$HOME/.cache/ms-playwright"
          if [ -d "$cache_dir" ] && [ "$(find "$cache_dir" -maxdepth 1 -name 'chromium-*' | wc -l)" -gt 0 ]; then
            echo "playwright browser cache hit"
          else
            pnpm --filter @sit/web exec playwright install --with-deps chromium
          fi

      - name: Gate 7 — Browser E2E
        id: gate7
        run: pnpm --filter @sit/web test:e2e 2>&1 | tee e2e.log

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-7-e2e-report
          path: |
            e2e.log
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn

      - name: Summary — E2E
        if: always()
        run: |
          {
            echo "## CI Pipeline — Browser E2E (Gate 7)"
            echo ""
            echo "Overall: ${{ steps.gate7.outcome == 'success' && 'passed' || 'failed' }}"
            echo ""
            echo "| Suite | Status |"
            echo "|-------|--------|"
            echo "| Playwright journeys + axe + mobile | ${{ steps.gate7.outcome == 'success' && 'passed' || 'failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s e2e.log ]; then
            {
              echo ""
              echo "<details><summary>E2E log</summary>"
              echo ""
              echo '```'
              tail -n 60 e2e.log
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ----- Gate 9: Mutation testing (non-blocking calibration) ----------------
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @sit/api exec prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Gate 9 — Mutation testing (pure-logic scope)
        id: gate9
        run: |
          cd apps/api
          npx stryker run 2>&1 | tee mutation.log

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-9-mutation-report
          path: |
            apps/api/mutation.log
            apps/api/reports/
          if-no-files-found: warn

      - name: Summary — Mutation
        if: always()
        run: |
          {
            echo "## CI Pipeline — Mutation Testing (Gate 9, non-blocking)"
            echo ""
            echo "Overall: ${{ steps.gate9.outcome == 'success' && 'completed' || 'failed (non-blocking)' }}"
            echo ""
            echo "| Scope | Status |"
            echo "|-------|--------|"
            echo "| token.service + password.service + upload.constants | ${{ steps.gate9.outcome == 'success' && 'completed' || 'see log' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s apps/api/mutation.log ]; then
            {
              echo ""
              echo "<details><summary>Mutation score table</summary>"
              echo ""
              echo '```'
              grep -A12 "Mutation score" apps/api/mutation.log || tail -n 30 apps/api/mutation.log
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  security:
    name: Security & Supply Chain
    runs-on: ubuntu-24.04
    needs: [quality]
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0 # required for full-history secret scan

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----- Gate 5a: Secret detection (blocking) -------------------------
      - name: Gate 5a — Secret detection
        id: gate5a
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks detect --verbose --source . --redact 2>&1 | tee gitleaks.log

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-5a-gitleaks-report
          path: gitleaks.log
          if-no-files-found: warn

      # ----- Gate 5b: SAST (blocking, with OWASP ruleset) -----------------
      - name: Install Semgrep
        run: pip install semgrep==1.121.0

      - name: Gate 5b — Static analysis (OWASP)
        id: gate5b
        run: |
          semgrep \
            --config security/semgrep.yml \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --sarif \
            --output semgrep.sarif \
            --error \
            . 2>&1 | tee semgrep.log

      - name: Upload Semgrep SARIF to Security tab
        id: sarif
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload Semgrep artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-5b-semgrep-report
          path: |
            semgrep.sarif
            semgrep.log
          if-no-files-found: warn

      # ----- Gate 5c: SCA + image scan (blocking on HIGH/CRITICAL) --------
      - name: Build image for scanning
        if: always()
        run: docker build -f apps/api/Dockerfile -t sit-api:scan .

      - name: Gate 5c — Image vulnerability scan (blocking)
        id: gate5c
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'sit-api:scan'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'json'
          output: 'trivy-results.json'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-5c-trivy-report
          path: trivy-results.json
          if-no-files-found: warn

      - name: Generate Trivy Report for Summary
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'sit-api:scan'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
          output: 'trivy-results.txt' # Save to a file

      - name: Gate 5d — SBOM generation
        id: gate5d
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'sit-api:scan'
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gate-5d-sbom
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Summary — Security gates
        if: always()
        run: |
          {
            echo "## CI Pipeline — Security & Supply Chain"
            echo ""
            echo "Overall: ${{ (steps.gate5a.outcome == 'success' && steps.gate5b.outcome == 'success' && steps.sarif.outcome == 'success' && steps.gate5c.outcome == 'success' && steps.gate5d.outcome == 'success') && 'all gates passed' || 'one or more gates failed' }}"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| 5a — Gitleaks | ${{ steps.gate5a.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 5b — Semgrep | ${{ steps.gate5b.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 5b SARIF ingest | ${{ steps.sarif.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 5c — Trivy image scan | ${{ steps.gate5c.outcome == 'success' && 'passed' || 'failed' }} |"
            echo "| 5d — SBOM inventory | ${{ steps.gate5d.outcome == 'success' && 'passed' || 'failed' }} |"
            echo ""
            echo "Artifacts are downloadable from the run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── NEW: collapsible per-gate content for 5a / 5b / 5c / 5d ──
      # Trivy image-scan report is published through the same helper below.
      - name: Publish security gate logs to summary
        if: always()
        run: |
          publish() {
            title="$1"; file="$2"; max="${3:-200}"
            [ -s "$file" ] || return 0
            total=$(wc -l < "$file")
            {
              echo ""
              echo "<details><summary>${title} — ${total} lines</summary>"
              echo ""
              echo '```'
              if [ "$total" -le "$max" ]; then
                cat "$file"
              else
                head -n $((max / 2)) "$file"
                echo "... $((total - max)) lines omitted ..."
                tail -n $((max / 2)) "$file"
              fi
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          publish "Gate 5a — Gitleaks" gitleaks.log
          publish "Gate 5b — Semgrep" semgrep.log 300
          publish "Gate 5c — Trivy image scan" trivy-results.txt

          # SBOM is JSON, not a log — show size + first lines to prove it exists
          if [ -s sbom.cdx.json ]; then
            {
              echo ""
              echo "<details><summary>Gate 5d — SBOM (CycloneDX) — $(wc -c < sbom.cdx.json) bytes</summary>"
              echo ""
              echo '```json'
              head -n 40 sbom.cdx.json
              echo '... (truncated)'
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
