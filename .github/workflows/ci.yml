name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose package scripts
        run: |
          pwd
          node --version
          pnpm --version
          node -p "require('./package.json').name"
          node -p "JSON.stringify(require('./package.json').scripts, null, 2)"
          pnpm run
          pnpm exec prettier --version

      - name: Format check
        run: pnpm --dir . run format:check

      - name: Lint
        run: pnpm --dir . run lint

      - name: Type check
        run: pnpm --dir . run typecheck

      - name: Run tests
        run: pnpm --dir . run test

      - name: Build
        run: pnpm --dir . run build
