name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

#_______________________________workflow hygiene_________________________________________

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.34.9
#________________________________________________________________________________________

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

        # _____ Gate 1: Formatting______________________________________________________
      - name: Gate 1 — Format check
        id: gate1 
        run: pnpm run format:check 2>&1 | tee format-check.log

      - name: Upload gate 1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-1-format-report
          path: format-check.log
          if-no-files-found: warn

      # ----- Gate 2: Lint --------------------------------------------------
      - name: Gate 2 — Lint
        id: gate2
        run: pnpm run lint 2>&1 | tee lint.log

      - name: Upload gate 2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-2-lint-report
          path: lint.log
          if-no-files-found: warn

      # ----- Gate 3: Type contract ----------------------------------------
      - name: Gate 3 — Type check
        id: gate3 
        run: pnpm run typecheck 2>&1 | tee typecheck.log

      - name: Upload gate 3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-typecheck-report
          path: typecheck.log
          if-no-files-found: warn

      # ----- Gate 4: Tests (no tests yet; the gate is wired, not active) ---
      - name: Gate 4 — Tests (dormant until tests exist)
        id: gate4
        run: |
          if find apps packages -type f \( -name "*.spec.ts" -o -name "*.test.ts" \) 2>/dev/null | grep -q .; then
            pnpm run test 2>&1 | tee test.log
          else
            echo "no test files exist yet; gate 4 is wired but dormant" | tee test.log
          fi

      - name: Upload gate 4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-4-test-report
          path: test.log
          if-no-files-found: warn

      # ----- Gate 6: Build -------------------------------------------------
      - name: Gate 6 — Build API image
        id: gate6 
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t sit-api:${{ github.sha }} \
            --iidfile image-digest.txt \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            . 2>&1 | tee build.log

      - name: Upload gate 6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-6-build-report
          path: |
            build.log
            image-digest.txt
          if-no-files-found: warn

      # ----- Gate 8: Deployment checks ------------------------------------
      - name: Gate 8 — Compose manifest validation
        id: gate8 
        run: |
          docker compose -f infrastructure/docker-compose.yml config -q
          docker compose -f infrastructure/docker-compose.yml config --no-interpolate > compose-rendered.yaml
          echo "compose manifest is syntactically valid" | tee gate-8.log

      - name: Gate 8 — Environment contract
        run: |
          if [ ! -f .env.compose.example ]; then
            echo "::error::.env.compose.example is missing"
            exit 1
          fi
          missing=0
          for var in $(grep -oE '^[A-Z_]+' .env.compose.example); do
            if ! grep -qF "\${$var" compose-rendered.yaml; then
              echo "::error::environment variable $var declared in .env.compose.example but not consumed by compose"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "environment contract satisfied ($(grep -cE '^[A-Z_]+' .env.compose.example) variables)" | tee -a gate-8.log

      - name: Gate 8 — Image integrity
        run: |
          DIGEST=$(cat image-digest.txt)
          if [ -z "$DIGEST" ]; then
            echo "::error::image digest is empty; the build artifact is not traceable"
            exit 1
          fi
          echo "image digest: $DIGEST" | tee -a gate-8.log

      - name: Upload gate 8 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-8-deployment-report
          path: |
            gate-8.log
            compose-rendered.yaml
          if-no-files-found: warn

      - name: Summary — Quality gates
        if: always()
        run: |
          {
            echo "## Quality & Build — Gate Results"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| 1 Format | \`${{ steps.gate1.outcome }}\` |"
            echo "| 2 Lint | \`${{ steps.gate2.outcome }}\` |"
            echo "| 3 Typecheck | \`${{ steps.gate3.outcome }}\` |"
            echo "| 4 Tests (dormant) | \`${{ steps.gate4.outcome }}\` |"
            echo "| 6 Build | \`${{ steps.gate6.outcome }}\` |"
            echo "| 8 Compose | \`${{ steps.gate8.outcome }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security & Supply Chain
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read 
    defaults: 
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for full-history secret scan

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----- Gate 5a: Secret detection (blocking) -------------------------
      - name: Gate 5a — Secret detection
        id: gate5a
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks detect --verbose --source . --redact 2>&1 | tee gitleaks.log

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-5a-gitleaks-report
          path: gitleaks.log
          if-no-files-found: warn

      # ----- Gate 5b: SAST (blocking, with OWASP ruleset) -----------------
      - name: Install Semgrep
        run: pip install semgrep==1.121.0

      - name: Gate 5b — Static analysis (OWASP)
        run: |
          semgrep \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --sarif \
            --output semgrep.sarif \
            --error \
            . 2>&1 | tee semgrep.log

      - name: Upload Semgrep SARIF to GitHub Security tab
        id: sarif 
        if: always()
        continue-on-error: true  
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-5b-semgrep-report
          path: |
            semgrep.sarif
            semgrep.log
          if-no-files-found: warn

      # ----- Gate 5c: SCA + image scan (blocking on HIGH/CRITICAL) --------
      - name: Install Trivy (pinned)
        if: always()  
        run: |
          TRIVY_VERSION=0.69.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          chmod +x /usr/local/bin/trivy

      - name: Build image for scanning
        if: always()  
        run: docker build -f apps/api/Dockerfile -t sit-api:scan .

      - name: Gate 5c — Image vulnerability scan (blocking)
        id: gate5c 
        if: always()
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output trivy-results.json \
            sit-api:scan 2>&1 | tee trivy.log

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-5c-trivy-report
          path: |
            trivy-results.json
            trivy.log
          if-no-files-found: warn

      # ----- Gate 5d: SBOM (supply-chain inventory, non-blocking by design)
      - name: Gate 5d — SBOM generation
        id: gate5d   
        if: always()  
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom.cdx.json \
            sit-api:scan 2>&1 | tee sbom.log

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-5d-sbom
          path: |
            sbom.cdx.json
            sbom.log
          if-no-files-found: warn
      - name: Summary — Security gates           # ← NEW: fills the run Summary tab
        if: always()
        run: |
          {
            echo "## Security & Supply Chain — Gate Results"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| 5a Gitleaks | \`${{ steps.gate5a.outcome }}\` |"
            echo "| 5b Semgrep | \`${{ steps.gate5b.outcome }}\` |"
            echo "| 5b SARIF ingest | \`${{ steps.sarif.outcome }}\` |"
            echo "| 5c Trivy image scan | \`${{ steps.gate5c.outcome }}\` |"
            echo "| 5d SBOM inventory | \`${{ steps.gate5d.outcome }}\` |"
            echo ""
            echo "Artifacts are downloadable from the run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"