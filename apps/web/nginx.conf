# S.I.T web production server: SPA + API reverse proxy.
#
# Mirrors the Vite dev proxy (apps/web/vite.config.ts): the browser
# calls /api/* and the proxy strips the prefix because the API
# serves its endpoints at the server root. The `api` hostname is
# Compose DNS for the API service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API reverse proxy: /api/auth/login -> http://api:3000/auth/login
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be several MB; allow generous body sizes.
        client_max_body_size 16m;
    }

    # SPA fallback: client-side routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
