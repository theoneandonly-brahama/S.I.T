# S.I.T web production server: SPA + API reverse proxy, non-root.
#
# This is the complete nginx main config (copied to /etc/nginx/nginx.conf),
# not a conf.d snippet: the container runs as the `nginx` user, which
# cannot bind port 80 or write the default pid/temp paths.
#
# Mirrors the Vite dev proxy (apps/web/vite.config.ts): the browser
# calls /api/* and the proxy strips the prefix because the API serves
# its endpoints at the server root. The `api` hostname is Compose DNS
# for the API service.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Writable temp paths for the unprivileged worker.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # API reverse proxy: /api/auth/login -> http://api:3000/auth/login
        location /api/ {
            proxy_pass http://api:3000/;
            proxy_http_version 1.1;
            # Fixed upstream host: the API serves at the root and does not
            # use virtual hosting, so a client-supplied Host header is never
            # needed — and would be attacker-controlled.
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Uploads can be several MB; allow generous body sizes.
            client_max_body_size 16m;
        }

        # SPA fallback: client-side routes serve index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
