services:
  postgres:
    image: postgres:16-alpine
    container_name: sit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sit_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sit_dev_password_only}
      POSTGRES_DB: ${DB_NAME:-sit_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-sit_user} -d ${DB_NAME:-sit_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: sit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sit_user:sit_dev_password_only@postgres:5432/sit_db
      NODE_ENV: production
      # Global rate limit per route (defaults to 10/min). Raise for
      # E2E runs, which make many requests from one IP:
      #   THROTTLE_LIMIT=1000 docker compose up -d --build api
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-10}
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: sit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Tutor/demo entry point: the full app (SPA + proxied API).
      - '127.0.0.1:8080:80'

volumes:
  postgres_data:
    name: sit_postgres_data
