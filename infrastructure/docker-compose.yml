services:
  postgres:
    image: postgres:16-alpine
    container_name: sit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sit_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sit_dev_password_only}
      POSTGRES_DB: ${DB_NAME:-sit_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sit_user} -d ${DB_NAME:-sit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: sit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sit_user:sit_dev_password_only@postgres:5432/sit_db
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: sit_postgres_data